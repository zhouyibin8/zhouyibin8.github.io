bio: |-
  I am a PhD student at the School of Hotel and Tourism Management, The Hong Kong Polytechnic University, supervised by [Chen Jason Zhang](https://scholar.google.com/citations?user=U6-ouN0AAAAJ). My research focuses on **AI in tourism**, **social media**, **destination marketing**, and **visually impaired tourists**, integrating computer science, econometrics, and interdisciplinary perspectives to understand tourism and social phenomena.

  Before PolyU, I earned an M.S. in Learning Analytics from Columbia University and a bachelor's degree in International Tourism Management from Macau University of Science and Technology. Along the way I worked on strategy and research projects at Wynn Palace, Savills, and Vanke.
bio_zh: |-
  我是香港理工大学酒店及旅游业管理学院的博士研究生，导师为 [Chen Jason Zhang ](https://scholar.google.com/citations?user=U6-ouN0AAAAJ)。我的研究聚焦于**旅游人工智能**、**社交媒体**、**目的地营销**与**视障游客**，并尝试结合计算机科学、计量经济学与跨学科视角理解旅游与社会现象。

  此前，我在哥伦比亚大学获得学习分析理学硕士学位，在澳门科技大学获得国际旅游管理学士学位，并曾在永利皇宫、第一太平戴维斯（Savills）和万科参与战略与研究工作。
