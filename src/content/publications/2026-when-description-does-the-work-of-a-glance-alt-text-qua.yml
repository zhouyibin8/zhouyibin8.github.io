abstract: 'Alternative text is a primary channel through which destination images become accessible to tourists with vision impairment, yet prevailing standards define its adequacy by availability rather than communicative consequences. This research develops and tests a dual-pathway framework of non-visual information processing. A qualitative study derives three dimensions of alt-text quality from tourists with vision impairment: structural organization, sensory richness, and cognitive relevance. Three experiments trace a cognitive chain from integration through imagery to memory, with sighted tourists included as a comparison group. High-quality alt-text reduced cognitive load, improved comprehension accuracy, and enhanced imagery and memory for tourists with vision impairment, substantially narrowing the gap with sighted tourists. For sighted tourists, the same descriptions imposed a processing cost that reduced imagery and memory. Perceptual access therefore emerges as a boundary condition for information processing and cognitive load theories, and description quality operates as a cognitive variable rather than a compliance threshold.'
